version: '3.8'

services:
  # ---- Data Layer ----
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: nexus-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma

  # ---- Application Layer ----
  # NOTE: Ollama runs natively on the host (port 11434). No Docker container needed.
  nexus-api:
    build: .
    container_name: nexus-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret_2024
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  # Workers run as separate processes
  workers:
    build: .
    container_name: nexus-workers
    command: node -e "require('./queue/browser-worker'); require('./queue/shell-worker'); require('./queue/api-worker'); setInterval(() => {}, 60000);"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SHELL_SANDBOX: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: nexus-dashboard
    ports:
      - "4001:4001"
    environment:
      NEXT_PUBLIC_API_URL: http://nexus-api:4000/api
      PORT: 4001
    depends_on:
      - nexus-api

volumes:
  pgdata:
  redisdata:
  chromadata:
